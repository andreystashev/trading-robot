name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python tools/install_dependencies.py
      - run: python -m pip check
      - run: python -m unittest discover -s trading_bot/tests -q
      - run: python tools/check_publication.py
      - run: python -m compileall -q trading_bot tools
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t trading-robot:test .
      - run: docker run --rm --entrypoint python trading-robot:test -m unittest discover -s trading_bot/tests -q
      - run: cp trading_bot/.env.example trading_bot/.env
      - run: docker compose config --quiet
      - run: docker compose up -d
      - run: curl --fail --retry 10 --retry-delay 2 --retry-all-errors http://127.0.0.1:8765/api/status -o /dev/null
      - if: failure()
        run: docker compose logs --no-color
      - if: always()
        run: docker compose down
